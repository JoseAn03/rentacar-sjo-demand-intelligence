name: Pipeline de datos

on:
  # Programado: todos los días a las 06:00 UTC.
  schedule:
    - cron: "0 6 * * *"
  # Manual desde la UI de GitHub.
  workflow_dispatch:
  # En cada push a main.
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pipeline (generar -> staging -> marts -> validar)
        run: python src/pipeline.py --hasta validar

      - name: Ejecutar tests
        run: python -m pytest tests/ -v
